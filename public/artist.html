<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Merci: MoMA — one artist</title>
<meta name="description" content="A screenful of one random artist from The Museum of Modern Art.">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="artist.css">

</head>
<body class="wall-page">
<main>
  <div id="wall" aria-busy="true"></div>
</main>

<div class="controls">
  <button id="another" type="button" aria-label="Another artist" title="Another artist (R)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M20 12a8 8 0 1 1-2.34-5.66"/>
      <path d="M20 4v5h-5"/>
    </svg>
  </button>
  <button id="reshuffle" type="button" aria-label="Rehang this artist" title="Rehang this artist (S)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="m4 4 5 5"/>
    </svg>
  </button>
  <button id="hang-mode" type="button" aria-label="Change the hang" title="Change the hang (H)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="3" y="4" width="18" height="6" rx="1"/>
      <rect x="3" y="14" width="10" height="6" rx="1"/>
      <rect x="15" y="14" width="6" height="6" rx="1"/>
    </svg>
  </button>
  <button id="find" type="button" aria-label="Find an artist" title="Find an artist (/)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/>
    </svg>
  </button>
  <a id="single" href="./" aria-label="One work at a time" title="One work at a time">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="3" y="3" width="18" height="18" rx="2"/><path d="m3 16 5-5 4 4 3-3 6 6"/>
    </svg>
  </a>
</div>

<div id="bottom">
  <aside id="card">
    <button id="card-summary" type="button" aria-expanded="false" aria-controls="card-details" title="More about this artist (I)">
      <strong id="card-name"></strong><span id="card-bio"></span>
    </button>
    <div id="card-details" hidden>
      <p id="card-holdings"></p>
      <p id="card-controls">
        <button id="hang-name" type="button" title="Change the hang (H)"></button>
        <span class="sep">&middot;</span>
        <span class="density">
          <button type="button" data-step="-1" aria-label="Fewer, larger works">&minus;</button>
          <span id="density-label">works</span>
          <button type="button" data-step="1" aria-label="More, smaller works">+</button>
        </span>
        <span class="sep">&middot;</span>
        <button id="drift-toggle" type="button" aria-pressed="false"></button>
      </p>
      <p class="card-row">
        <a id="card-link" href="" target="_blank" rel="noopener">View at MoMA</a>
        <span class="spacer"></span>
        <button id="card-close" type="button" aria-label="Close details">&times;</button>
      </p>
    </div>
  </aside>
  <footer>Inspired by the work of JB, JS 2026.</footer>
</div>

<div id="search" hidden>
  <div id="search-box">
    <input id="search-input" type="search" autocomplete="off" spellcheck="false"
           placeholder="Find an artist" aria-label="Find an artist"
           role="combobox" aria-expanded="false" aria-controls="search-results" aria-autocomplete="list">
    <ul id="search-results" role="listbox" aria-label="Artists"></ul>
  </div>
</div>

<div id="zoom" hidden role="dialog" aria-modal="true" aria-label="Work">
  <img id="zoom-img" alt="">
  <div id="zoom-bar">
    <p id="zoom-caption"><em id="zoom-title"></em><span id="zoom-date"></span></p>
    <span class="spacer"></span>
    <a id="zoom-link" href="" target="_blank" rel="noopener">View at MoMA</a>
    <button id="zoom-download" type="button" aria-label="Download image" title="Download image">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>
      </svg>
    </button>
    <button id="zoom-close" type="button" aria-label="Close">&times;</button>
  </div>
</div>

<noscript><p class="noscript">This page needs JavaScript to hang a wall of artworks.</p></noscript>

<script src="hang.js"></script>
<script src="artist.js"></script>
</body>
</html>
